services:
  server:
    build:
      context: .
      target: server
    environment:
      LOG_ARITHMIC_HOST: 0.0.0.0
      LOG_ARITHMIC_PORT: 8787
      LOG_ARITHMIC_DATABASE: /data/log-arithmic.sqlite
      LOG_ARITHMIC_ADMIN_TOKEN: ${LOG_ARITHMIC_ADMIN_TOKEN:?Set LOG_ARITHMIC_ADMIN_TOKEN in .env}
      LOG_ARITHMIC_RETENTION_DAYS: ${LOG_ARITHMIC_RETENTION_DAYS:-30}
      LOG_ARITHMIC_CORS_ORIGIN: http://localhost:5173
    volumes:
      - log-arithmic-data:/data
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/ready').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  log-arithmic-data:
